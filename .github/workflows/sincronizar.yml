# EPISJ 360 em episj360.episj.com
# A app continua a ser publicada em EduSpruce/eduspruce.github.io (pasta boxdoc/).
# Este fluxo traz essa pasta para aqui (de 10 em 10 minutos, ou à mão em Actions › Sincronizar › Run workflow).
# Não mexer nos ficheiros deste repositório à mão: são substituídos na sincronização seguinte (exceto CNAME, .nojekyll, LEIA-ME.md e .github).
name: Sincronizar
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sincronizar
  cancel-in-progress: false
jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trazer a app de EduSpruce/eduspruce.github.io
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/EduSpruce/eduspruce.github.io /tmp/origem
          git -C /tmp/origem sparse-checkout set boxdoc esm
          rsync -a --delete --exclude .git --exclude .github --exclude CNAME --exclude .nojekyll --exclude LEIA-ME.md --exclude esm /tmp/origem/boxdoc/ ./
          mkdir -p esm && cp /tmp/origem/esm/supabase-2.117.3.min.js esm/
          echo "episj360.episj.com" > CNAME
          touch .nojekyll
      - name: Publicar se mudou
        run: |
          git add -A
          if git diff --cached --quiet; then echo "Sem alterações"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Sincronizar com eduspruce.github.io/boxdoc ($(git -C /tmp/origem log -1 --format=%h))"
          git push
